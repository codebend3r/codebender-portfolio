<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Sunset Stars</title>
    <!-- Use Tailwind CSS for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom styles for the sunset gradient and star canvas */
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow-x: hidden;
        background: linear-gradient(
          to bottom,
          #ff7e5f,
          #feb47b
        ); /* Fallback gradient */
        background: linear-gradient(to bottom, #ff7e5f, #feb47b);
      }

      .sunset-bg {
        /* Create a beautiful sunset gradient background */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: linear-gradient(to bottom, #ff7e5f, #feb47b);
        background: linear-gradient(
          to bottom,
          #3a2e4f,
          #6d5b88,
          #b7a6d8,
          #d8b7d6
        ); /* Deep sunset colors */
      }

      #star-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <!-- The background with the sunset gradient -->
    <div class="sunset-bg"></div>

    <!-- The canvas for drawing the stars -->
    <canvas id="star-canvas"></canvas>

    <!-- Content to enable scrolling -->
    <main class="relative z-10 w-full min-h-[300vh] text-center pt-96">
      <div
        class="px-8 py-16 text-white bg-black bg-opacity-50 rounded-lg max-w-2xl mx-auto shadow-xl backdrop-blur-sm"
      >
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold mb-4">
          Parallax Stars
        </h1>
        <p class="text-lg sm:text-xl md:text-2xl mb-8 font-light">
          Scroll down to see the stars move in parallax.
        </p>
        <p class="text-md sm:text-lg">
          This simple effect is achieved by updating the canvas based on the
          page's scroll position. The content below creates the necessary
          scrollable area.
        </p>
      </div>
      <!-- This extra div provides a lot of height to create a scrollable page -->
      <div class="h-[200vh]"></div>
    </main>

    <!-- The TypeScript code embedded within a script tag -->
    <script type="module">
      /**
       * @file This script handles the parallax star effect using a canvas.
       * It uses a TypeScript-like structure with JSDoc for clarity.
       */

      // Get the canvas and its context
      const canvas = document.getElementById("star-canvas")
      if (!canvas) {
        console.error("Canvas element not found.")
      }

      const ctx = canvas.getContext("2d")
      const dpr = window.devicePixelRatio || 1

      // Class to represent a single star
      class Star {
        /**
         * @param {number} x The initial x coordinate of the star.
         * @param {number} y The initial y coordinate of the star.
         * @param {number} radius The radius of the star.
         * @param {number} alpha The opacity of the star.
         * @param {number} initialY The original Y position for parallax calculation.
         */
        constructor(x, y, radius, alpha) {
          this.x = x
          this.y = y
          this.radius = radius
          this.alpha = alpha
          this.initialY = y
        }

        // Draw the star on the canvas
        draw(ctx) {
          ctx.beginPath()
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false)
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`
          ctx.fill()
        }

        // Update the star's position based on scroll
        update(scrollY, parallaxFactor) {
          this.y = this.initialY - scrollY * parallaxFactor
        }
      }

      let stars = []
      const numStars = 200
      const parallaxFactor = 0.1 // Controls the parallax speed, lower is slower

      // Function to generate and initialize the stars
      function generateStars() {
        stars = []
        for (let i = 0; i < numStars; i++) {
          // Stars should be barely visible
          const alpha = Math.random() * 0.3 + 0.1
          const radius = Math.random() * 1.5 + 0.5
          const x = Math.random() * canvas.width
          const y = Math.random() * canvas.height
          stars.push(new Star(x, y, radius, alpha))
        }
      }

      // Function to handle canvas resizing
      function resizeCanvas() {
        canvas.width = window.innerWidth * dpr
        canvas.height = window.innerHeight * dpr
        ctx.scale(dpr, dpr)
        generateStars()
      }

      // Function to draw all stars
      function drawStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        stars.forEach((star) => star.draw(ctx))
      }

      // The animation loop
      function animate() {
        // Update star positions on each frame
        const scrollY = window.scrollY || window.pageYOffset
        stars.forEach((star) => star.update(scrollY, parallaxFactor))

        drawStars()
        requestAnimationFrame(animate)
      }

      // Initialize and start the animation
      window.addEventListener("load", () => {
        resizeCanvas()
        animate()
      })

      // Event listener for window resize
      window.addEventListener("resize", resizeCanvas)

      // Event listener for scroll
      window.addEventListener("scroll", () => {
        // The `animate` loop already handles the updates, this just makes the effect smoother.
        // No need to do anything here since `animate` is running.
      })
    </script>
  </body>
</html>
