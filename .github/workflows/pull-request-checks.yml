name: 🧪 Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Fast checks share one job so they pay for setup and install only once.
        include:
          - name: 🔍 Format, lint, and spellcheck
            run: bun run --sequential format:check lint spellcheck
          - name: 🧠 Typecheck and test
            run: bun run --sequential typecheck test
          - name: 🏗️ Build
            run: bun run build
            # The only entry that saves the install cache, so jobs don't race to reserve the same key.
            save-cache: true

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟩 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 💾 Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 💾 Save Bun install cache
        if: matrix.save-cache && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
