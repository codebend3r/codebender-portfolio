name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-check:
    name: System check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run ts:check

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Lint CSS
        run: bun run lint:css

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
