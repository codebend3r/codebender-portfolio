name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun ts:check

      - name: Prettier
        run: bun prettier:check

      - name: Lint
        run: bun lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
